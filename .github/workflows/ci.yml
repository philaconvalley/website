name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Declared here rather than inherited. The repo default is read-only today, but
# that is an org-level setting someone can widen later, and a workflow with no
# `permissions` block silently picks up whatever the default becomes. This job
# only ever reads the checkout, so it says so.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build and type check
        run: npm run build

      # The CSP allowlists build-generated inline scripts by hash, so a dependency
      # that changes those bytes silently invalidates the policy. Fails loudly here
      # rather than shipping an analytics script the browser will block.
      - name: Check CSP script hashes match the build
        run: npm run csp:hash

      # Prose budgets and sentence case, measured on the built pages. Both rules
      # drifted twice before a human caught them by reading; a source-level grep
      # cannot see labels that components generate or data arrays supply.
      - name: Check the design contract
        run: npm run check:design

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke suite
        run: npm run test:e2e

      # Serves dist/ with the vercel.json headers applied — `astro preview` ignores
      # them, so these assertions only mean anything under the dedicated config.
      - name: Run security header suite
        run: npm run test:csp

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pinned to a commit rather than the mutable `v12` tag: this is the only
      # third-party action in the repo, and a tag can be repointed at new code
      # without the reference here changing. Dependabot updates SHA pins and
      # keeps the version comment in sync, so this costs nothing to maintain.
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          uploadArtifacts: true
          configPath: .lighthouserc.json
