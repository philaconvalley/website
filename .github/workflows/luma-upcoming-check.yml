name: Luma upcoming events check

# Opens one issue when the Luma calendar has no event in the next 21 days, and
# closes it once one is scheduled. The site reads its events from Luma, so an
# empty calendar means an empty /events page and no RSVP target. See the script
# header for the full reasoning.

on:
  schedule:
    # Mondays 13:00 UTC (9 AM New York in summer, 8 AM in winter), the same slot
    # as the dependency rollup, so the weekly maintenance signals land together.
    - cron: '0 13 * * 1'
  # Re-check on demand after publishing an event, instead of waiting a week.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: luma-upcoming-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check the Luma calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/luma-upcoming-check.mjs

      # The member count in src/config.ts is typed by hand (no free Luma
      # source). Keep one issue open while it is more than 30 days old. Runs
      # even when the calendar check fails: a feed outage says nothing about it.
      - name: Check the member count age
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/member-count-age-check.mjs
