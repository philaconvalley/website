name: Diego Mendoza-Ramos
title: Product & Experience Designer
bio: >-
  Diego Mendoza-Ramos is a Mexican-born multidisciplinary artist and founder of
  Made By 54 Studios. From murals and brand identity to digital art, he has
  designed for clients like the LA Rams, LAFC, Nike, and Pocha Street. That
  same energy fueled the grassroots art and music festivals he created across
  Los Angeles, from Chuco's Justice Center and beyond. As Lead Product &
  Experience Designer, Diego builds PhilaCon Valley side by side with the
  founder and the community that makes it what it is, helping shape what we
  all see, feel, and step into, both online and in person. His North Star:
  creating safe spaces where underrepresented people can thrive, grow, and
  feel welcomed.
