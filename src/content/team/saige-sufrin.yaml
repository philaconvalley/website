name: Saige Sufrin
title: Creative Director
bio: >-
  Saige Sufrin is a creative marketing specialist based out of the Lehigh
  Valley, highlighting entertainment, culture, and the arts. In 2024 she
  founded Thymes Zup, a lowbrow art project based out of Bethlehem, PA.
  Painting is her primary focus, and she has partnered with local
  organizations to bring their creative visions to life through graphic
  design, working with Pennsylvania brands like Just Born, ArtsQuest, and
  HomeBase. Saige has shaped PhilaCon Valley's look since April 2025: she drew
  the keyboard pigeon mascot and the hand-drawn wordmark. As Creative
  Director, she shapes the brand's identity, its characters, and its creative
  direction.
