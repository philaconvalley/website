name: Jay Turner
title: Client & Technical Lead
bio: >-
  Jay Turner is a lover of creative tech. It's what happens when you love
  both. A DJ/producer, tinkerer, gamer, and developer, Jay helps people with
  tech by day and creates by night, always working on something different,
  whether that be a DJ set, an app, or building useful items. Jay found
  PhilaCon Valley as a neighbor in 2025, showing up to a game night and PATCH
  001 before joining the crew. As Client & Technical Lead, Jay brings new
  clients to the studio, builds and tests their sites and tools, and DJs our
  nights.
