<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Philacon — Philacon Valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hot-pink: #ff4fa8;
    --bright-pink: #ff69b4;
    --light-pink: #ffb6d9;
    --cream-pink: #ffe1ee;
    --purple: #b088d4;
    --dark-purple: #8a5fb8;
    --yellow: #fed766;
    --ink: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Fredoka', system-ui, sans-serif;
    background: var(--cream-pink);
    color: var(--ink);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255, 182, 217, 0.6) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(176, 136, 212, 0.4) 0%, transparent 45%),
      var(--cream-pink);
    padding: 10px;
  }
  .frame {
    position: relative;
    width: min(100vw - 20px, 440px);
    aspect-ratio: 9/16;
    max-height: calc(100vh - 20px);
    border-radius: 24px;
    overflow: hidden;
    background: linear-gradient(180deg, #ffd9e8 0%, #ffb6d9 55%, #ffc9c1 100%);
    box-shadow:
      0 0 0 4px var(--ink),
      0 0 0 10px var(--yellow),
      0 0 0 14px var(--ink),
      0 20px 60px rgba(0, 0, 0, 0.25);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }

  /* Overlays */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.active { pointer-events: auto; }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .title {
    font-family: 'Bowlby One', 'Fredoka', sans-serif;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 0.9;
    text-transform: uppercase;
    color: var(--bright-pink);
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow:
      4px 4px 0 var(--ink),
      4px 4px 0 1px var(--ink);
  }
  #startScreen .title {
    font-size: clamp(42px, 11vw, 64px);
  }
  #startScreen .title .row-1 {
    display: block;
    transform: rotate(-4deg);
    animation: bob 2.8s ease-in-out infinite;
  }
  #startScreen .title .row-2 {
    display: block;
    transform: rotate(3deg);
    margin-top: 4px;
    animation: bob 2.8s ease-in-out infinite 0.4s;
  }
  @keyframes bob {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(-4deg) translateY(-6px); }
  }
  #startScreen .title .row-2 {
    animation-name: bob2;
  }
  @keyframes bob2 {
    0%, 100% { transform: rotate(3deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-6px); }
  }

  .tagline {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 3.5vw, 18px);
    color: var(--ink);
    background: var(--yellow);
    padding: 6px 16px;
    border-radius: 100px;
    border: 3px solid var(--ink);
    margin-top: 18px;
    transform: rotate(-2deg);
    box-shadow: 3px 3px 0 var(--ink);
  }

  .mascot-preview {
    width: clamp(150px, 45%, 220px);
    margin: 22px 0 10px;
    animation: bob-gentle 2s ease-in-out infinite;
    filter: drop-shadow(4px 6px 0 rgba(26, 26, 26, 0.25));
  }
  @keyframes bob-gentle {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  .btn {
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(18px, 4.5vw, 24px);
    text-transform: uppercase;
    color: white;
    background: var(--hot-pink);
    border: 4px solid var(--ink);
    padding: 12px 28px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    letter-spacing: 0.03em;
    -webkit-text-stroke: 1.5px var(--ink);
    paint-order: stroke fill;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
  .btn.purple { background: var(--purple); }
  .btn.yellow { background: var(--yellow); color: var(--ink); -webkit-text-stroke: 0; }

  .hint {
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--ink);
    opacity: 0.8;
    margin-top: 16px;
  }
  .hint kbd {
    display: inline-block;
    background: white;
    border: 2px solid var(--ink);
    padding: 2px 8px;
    border-radius: 6px;
    font-family: 'Fredoka', monospace;
    font-weight: 700;
    box-shadow: 2px 2px 0 var(--ink);
    margin: 0 2px;
  }

  /* Game over */
  #gameOverScreen .title {
    font-size: clamp(40px, 10vw, 60px);
    color: var(--hot-pink);
    transform: rotate(-3deg);
  }
  .score-card {
    margin-top: 20px;
    background: white;
    border: 4px solid var(--ink);
    border-radius: 20px;
    padding: 18px 28px;
    box-shadow: 6px 6px 0 var(--ink);
    min-width: 220px;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 30px;
    font-family: 'Fredoka', sans-serif;
  }
  .score-row + .score-row { margin-top: 8px; }
  .score-label { font-weight: 500; font-size: 15px; color: var(--ink); opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
  .score-value { font-family: 'Bowlby One', sans-serif; font-size: 28px; color: var(--hot-pink); }
  .score-value.new-best {
    color: var(--dark-purple);
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .new-best-badge {
    display: inline-block;
    background: var(--yellow);
    color: var(--ink);
    font-family: 'Bowlby One', sans-serif;
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 100px;
    border: 2.5px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    margin-top: 12px;
    transform: rotate(3deg);
    animation: wiggle 0.6s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(3deg); }
    50% { transform: rotate(-3deg); }
  }

  /* In-game score */
  .hud-score {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Bowlby One', sans-serif;
    font-size: 56px;
    color: white;
    -webkit-text-stroke: 4px var(--ink);
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 var(--ink);
    pointer-events: none;
    z-index: 5;
    transition: transform 0.1s ease;
  }
  .hud-score.bump { transform: translateX(-50%) scale(1.2); }

  /* Credit */
  .credit {
    position: fixed;
    bottom: 8px;
    right: 12px;
    font-family: 'Fredoka', sans-serif;
    font-size: 11px;
    color: var(--ink);
    opacity: 0.5;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="frame">
  <canvas id="game"></canvas>

  <!-- HUD score during play -->
  <div id="hudScore" class="hud-score hidden" style="display:none">0</div>

  <!-- Start Screen -->
  <div id="startScreen" class="overlay active">
    <h1 class="title">
      <span class="row-1">Flappy</span>
      <span class="row-2">Philacon</span>
    </h1>
    <div class="tagline">PHILACON VALLEY</div>
    <img id="mascotPreview" class="mascot-preview" alt="Philacon pigeon mascot">
    <button id="startBtn" class="btn">Let's Flap</button>
    <div class="hint">Tap / Click / <kbd>Space</kbd> to flap</div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="overlay hidden">
    <h1 class="title">Oof!</h1>
    <div class="score-card">
      <div class="score-row">
        <span class="score-label">Score</span>
        <span id="finalScore" class="score-value">0</span>
      </div>
      <div class="score-row">
        <span class="score-label">Best</span>
        <span id="bestScore" class="score-value">0</span>
      </div>
    </div>
    <div id="newBestBadge" class="new-best-badge" style="display:none">✨ NEW HIGH SCORE ✨</div>
    <button id="retryBtn" class="btn purple" style="margin-top: 24px">Try Again</button>
  </div>
</div>
<div class="credit">PHILACON VALLEY · 2026</div>

// ============ CANVAS SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Logical game resolution (9:16 aspect)
const GW = 450;
const GH = 800;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(canvas.width / GW, canvas.height / GH);
}
window.addEventListener('resize', resizeCanvas);

// ============ GAME STATE ============
const GRAVITY = 0.55;
const FLAP = -9.2;
const MAX_FALL = 13;
const PIPE_SPEED = 3.2;
const PIPE_WIDTH = 90;       // visible width of a pipe (keyboard rotated)
const PIPE_GAP = 200;        // vertical gap between top & bottom pipes
const PIPE_INTERVAL = 260;   // pixels between consecutive pipe pairs
const GROUND_Y = GH - 90;
const BIRD_X = GW * 0.28;

const STATE = { START: 'start', PLAY: 'play', DEAD: 'dead' };

let state = STATE.START;
let bird = { x: BIRD_X, y: GH/2, vy: 0, r: 28, rot: 0 };
let pipes = [];
let spawnDist = 0;   // distance since last pipe spawn
let scrollX = 0;     // for parallax
let score = 0;
let best = 0;
// The arcade embeds this in a sandbox without allow-same-origin, which puts the
// document in an opaque origin where localStorage throws rather than returning
// null. High score degrades to session-only rather than breaking the game.
function readHighScore() {
  try {
    return parseInt(localStorage.getItem('flappy_philacon_best'), 10) || 0;
  } catch {
    return 0;
  }
}
function writeHighScore(value) {
  try {
    localStorage.setItem('flappy_philacon_best', String(value));
  } catch {
    /* opaque origin — score is session-only */
  }
}
best = readHighScore();
function saveBest() {
  writeHighScore(best);
}
let flashAlpha = 0;  // red-ish flash on death
let particles = [];
let tutorialPulse = 0;

// ============ INPUT ============
function flap() {
  if (state === STATE.START) {
    startGame();
    return;
  }
  if (state === STATE.PLAY) {
    bird.vy = FLAP;
    spawnFeathers(bird.x, bird.y, 3);
  }
}
function onKey(e) {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (state === STATE.DEAD) return;
    flap();
  } else if (e.code === 'Enter' && state === STATE.DEAD) {
    resetGame();
  }
}
window.addEventListener('keydown', onKey);
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state === STATE.DEAD) return;
  flap();
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', resetGame);

// ============ GAME LOGIC ============
function startGame() {
  state = STATE.PLAY;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  const hud = document.getElementById('hudScore');
  hud.style.display = 'block';
  hud.classList.remove('hidden');
  resetBird();
  pipes = [];
  spawnDist = PIPE_INTERVAL - 100; // first pipe comes a bit quick
  score = 0;
  updateHud();
  bird.vy = FLAP;
}

function resetGame() {
  document.getElementById('gameOverScreen').classList.add('hidden');
  startGame();
}

function resetBird() {
  bird.x = BIRD_X;
  bird.y = GH / 2 - 40;
  bird.vy = 0;
  bird.rot = 0;
}

function spawnPipe() {
  // Random gap Y within safe bounds
  const minY = 90;
  const maxY = GROUND_Y - PIPE_GAP - 90;
  const gapY = Math.floor(minY + Math.random() * (maxY - minY));
  pipes.push({ x: GW + PIPE_WIDTH, gapY, passed: false });
}

function update(dt) {
  scrollX += PIPE_SPEED * 0.4;
  tutorialPulse += dt;

  if (state === STATE.PLAY) {
    bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
    bird.y += bird.vy;
    // Rotation based on velocity
    const target = Math.max(-0.5, Math.min(1.2, bird.vy / 12));
    bird.rot += (target - bird.rot) * 0.15;

    // Spawn pipes
    spawnDist += PIPE_SPEED;
    if (spawnDist >= PIPE_INTERVAL) {
      spawnDist = 0;
      spawnPipe();
    }

    // Move pipes
    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
        p.passed = true;
        score++;
        updateHud(true);
      }
    }
    // Remove off-screen
    pipes = pipes.filter(p => p.x + PIPE_WIDTH > -20);

    // Collisions
    checkCollisions();
  }

  if (state === STATE.DEAD) {
    // Bird keeps falling until hits ground
    bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
    bird.y += bird.vy;
    bird.rot += 0.08;
    if (bird.y + bird.r > GROUND_Y) {
      bird.y = GROUND_Y - bird.r;
      bird.vy = 0;
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= dt;
    p.rot += p.vrot;
  }
  particles = particles.filter(p => p.life > 0);

  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.5);
}

function checkCollisions() {
  // Ground
  if (bird.y + bird.r * 0.75 > GROUND_Y) {
    bird.y = GROUND_Y - bird.r * 0.75;
    die();
    return;
  }
  // Ceiling
  if (bird.y - bird.r < 0) {
    bird.y = bird.r;
    bird.vy = 0;
  }
  // Pipes — use rotated bounding boxes
  const bx = bird.x, by = bird.y;
  const br = bird.r * 0.72; // slightly forgiving hitbox
  for (const p of pipes) {
    // Top pipe rect: x=p.x, y=0, w=PIPE_WIDTH, h=p.gapY
    // Bottom pipe rect: x=p.x, y=p.gapY+PIPE_GAP, w=PIPE_WIDTH, h=GROUND_Y-(p.gapY+PIPE_GAP)
    if (circleRect(bx, by, br, p.x, 0, PIPE_WIDTH, p.gapY) ||
        circleRect(bx, by, br, p.x, p.gapY + PIPE_GAP, PIPE_WIDTH, GROUND_Y - (p.gapY + PIPE_GAP))) {
      die();
      return;
    }
  }
}

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return dx*dx + dy*dy < r*r;
}

let wasNewBest = false;
function die() {
  if (state !== STATE.PLAY) return;
  state = STATE.DEAD;
  flashAlpha = 1;
  spawnFeathers(bird.x, bird.y, 16);
  wasNewBest = score > best;
  if (wasNewBest) { best = score; saveBest(); }
  setTimeout(() => showGameOver(), 750);
}

function showGameOver() {
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestScore').textContent = best;
  const hud = document.getElementById('hudScore');
  hud.classList.add('hidden');
  hud.style.display = 'none';
  const badge = document.getElementById('newBestBadge');
  const bestEl = document.getElementById('bestScore');
  bestEl.classList.remove('new-best');
  if (wasNewBest && score > 0) {
    badge.style.display = 'inline-block';
    bestEl.classList.add('new-best');
  } else {
    badge.style.display = 'none';
  }
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function updateHud(bump) {
  const el = document.getElementById('hudScore');
  el.textContent = score;
  if (bump) {
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 120);
  }
}

function spawnFeathers(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 1) * 5,
      life: 0.6 + Math.random() * 0.6,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.3,
      size: 6 + Math.random() * 6,
      color: Math.random() < 0.5 ? '#fed766' : '#ff69b4'
    });
  }
}

// ============ RENDERING ============
function draw() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, GH);
  sky.addColorStop(0, '#ffd9e8');
  sky.addColorStop(0.55, '#ffb6d9');
  sky.addColorStop(1, '#ffc9c1');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, GW, GH);

  // Clouds (pink fluffy)
  drawClouds();

  // Philadelphia skyline silhouette
  drawSkyline();

  // Pipes (keyboards)
  for (const p of pipes) drawPipe(p);

  // Ground
  drawGround();

  // Bird
  drawBird();

  // Particles (feathers)
  for (const pt of particles) {
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.rot);
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, pt.size, pt.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Death flash
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
    ctx.fillRect(0, 0, GW, GH);
  }

  // Tutorial prompt on start
  if (state === STATE.START) {
    // Nothing overlaid on canvas; HTML overlay handles it
  }
}

function drawClouds() {
  const offset = (scrollX * 0.25) % 300;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
  ctx.strokeStyle = 'rgba(26, 26, 26, 0.18)';
  ctx.lineWidth = 2;
  const clouds = [
    { x: 80,  y: 130, r: 28 },
    { x: 260, y: 80,  r: 22 },
    { x: 380, y: 180, r: 26 },
    { x: 140, y: 230, r: 20 },
  ];
  for (const c of clouds) {
    const cx = ((c.x - offset) % (GW + 120) + (GW + 120)) % (GW + 120) - 40;
    drawCloud(cx, c.y, c.r);
  }
}
function drawCloud(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 0.9, y + 4, r * 0.8, 0, Math.PI * 2);
  ctx.arc(x - r * 0.9, y + 4, r * 0.7, 0, Math.PI * 2);
  ctx.arc(x + r * 0.3, y - r * 0.6, r * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

function drawSkyline() {
  const baseY = GROUND_Y;
  const offset = (scrollX * 0.5) % (GW * 0.5);
  // Darker purple silhouette, tiled
  ctx.fillStyle = '#8a5fb8';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  const buildings = [
    { w: 60, h: 120 }, { w: 45, h: 85 }, { w: 80, h: 180 },
    { w: 55, h: 110 }, { w: 70, h: 150, city_hall: true },
    { w: 50, h: 95 }, { w: 65, h: 130 }, { w: 40, h: 75 },
    { w: 58, h: 140 },
  ];
  let x = -offset - 40;
  // Draw buildings with filled path + stroke later
  const cityPath = new Path2D();
  cityPath.moveTo(x, baseY);
  while (x < GW + 40) {
    for (const b of buildings) {
      cityPath.lineTo(x, baseY - b.h);
      cityPath.lineTo(x + b.w, baseY - b.h);
      x += b.w;
    }
  }
  cityPath.lineTo(x, baseY);
  cityPath.closePath();
  ctx.fill(cityPath);
  ctx.stroke(cityPath);

  // Add windows in lighter pink (sparse, stylized)
  ctx.fillStyle = '#ffb6d9';
  x = -offset - 40;
  while (x < GW + 40) {
    for (const b of buildings) {
      if (b.h > 90) {
        const rows = Math.floor((b.h - 20) / 18);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < 2; c++) {
            if ((r + c + Math.floor(x / 40)) % 3 === 0) continue;
            ctx.fillRect(x + 12 + c * 20, baseY - b.h + 12 + r * 18, 8, 10);
          }
        }
      }
      x += b.w;
    }
  }
}

function drawGround() {
  // Ground strip: yellow band with black line
  ctx.fillStyle = '#fed766';
  ctx.fillRect(0, GROUND_Y, GW, GH - GROUND_Y);
  // Scrolling stripes
  ctx.fillStyle = '#ff69b4';
  const stripeOffset = scrollX % 40;
  for (let x = -stripeOffset - 40; x < GW + 40; x += 40) {
    ctx.fillRect(x, GROUND_Y + 16, 20, 6);
  }
  // Top border line
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, GROUND_Y, GW, 4);
  // Bottom accent
  ctx.fillRect(0, GROUND_Y + 40, GW, 2);
}

function drawPipe(p) {
  // Top keyboard (flipped vertically) and bottom keyboard
  // We'll draw a stretched rotated keyboard image.
  // Top pipe: from y=0 down to p.gapY. The mouth (keys-up side) points DOWN.
  // Bottom pipe: from y=p.gapY+PIPE_GAP down to GROUND_Y. Mouth points UP.

  drawKeyboardPipe(p.x, 0, PIPE_WIDTH, p.gapY, 'top');
  drawKeyboardPipe(p.x, p.gapY + PIPE_GAP, PIPE_WIDTH, GROUND_Y - (p.gapY + PIPE_GAP), 'bottom');
}

function drawKeyboardPipe(x, y, w, h, orientation) {
  if (h <= 0) return;

  // The keyboard image is horizontal (wide, short). We rotate it 90° to make vertical.
  // Rotated, its "length" (was width) becomes the height of the pipe.
  // We want to tile the keyboard vertically OR stretch a single image.
  // A single stretched image looks off for tall pipes; tile it.

  const kbW = keyboardImg.width || 120;
  const kbH = keyboardImg.height || 42;
  // After 90° rotation: drawn width = kbH (original height), drawn height = kbW (original width)
  // We want the pipe to be `w` wide and `h` tall.
  // Scale: sx = w / kbH,  sy = tile_height / kbW

  const pipeCol = w;                     // pipe width onscreen
  const tileLen = pipeCol * (kbW / kbH); // one tile's length when scaled so width matches
  // Actually simpler: scale uniformly so rotated keyboard's width = w. Then tile along height.
  const scale = pipeCol / kbH;
  const tileHeight = kbW * scale;

  // Cap + body approach: draw a "cap" at the mouth end that's the full keyboard image (so it looks like a keyboard face), and tile the body beyond.
  ctx.save();
  // Clip to pipe rect so tiles don't overflow
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();

  if (orientation === 'top') {
    // Mouth at the BOTTOM (y + h). Place cap at the bottom, body above.
    // Cap = one full rotated keyboard flush with mouth
    const capY = y + h - tileHeight;
    drawRotatedKeyboard(x, capY, w, tileHeight, false);
    // Tile above cap
    for (let ty = capY - tileHeight; ty > y - tileHeight; ty -= tileHeight) {
      drawRotatedKeyboard(x, ty, w, tileHeight, true);
    }
  } else {
    // Mouth at the TOP. Place cap at the top, body below. The cap should be flipped vertically so keys face UP.
    drawRotatedKeyboard(x, y, w, tileHeight, false, true);
    for (let ty = y + tileHeight; ty < y + h + tileHeight; ty += tileHeight) {
      drawRotatedKeyboard(x, ty, w, tileHeight, true, true);
    }
  }
  ctx.restore();

  // Draw pipe outline border
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3.5;
  ctx.strokeRect(x, y, w, h);

  // Draw a prominent "lip" / cap rim at the mouth
  const lipH = 14;
  ctx.fillStyle = '#ff4fa8';
  if (orientation === 'top') {
    // lip on bottom
    const ly = y + h - lipH;
    ctx.fillRect(x - 6, ly, w + 12, lipH);
    ctx.strokeRect(x - 6, ly, w + 12, lipH);
  } else {
    ctx.fillRect(x - 6, y, w + 12, lipH);
    ctx.strokeRect(x - 6, y, w + 12, lipH);
  }
}

function drawRotatedKeyboard(dx, dy, dw, dh, isBody, flipVertical = false) {
  // Draws keyboard image rotated 90° CW into rectangle (dx, dy, dw, dh).
  // isBody doesn't change anything here — we always draw the full keyboard image; tiling handles repeats.
  if (!keyboardImg.complete) return;
  ctx.save();
  // Move to center of target rect, rotate 90°, draw so it fits
  const cx = dx + dw / 2;
  const cy = dy + dh / 2;
  ctx.translate(cx, cy);
  ctx.rotate(Math.PI / 2);
  if (flipVertical) ctx.scale(1, -1);
  // After rotation, image drawn width = dh, height = dw (swapped)
  ctx.drawImage(keyboardImg, -dh / 2, -dw / 2, dh, dw);
  ctx.restore();
}

function drawBird() {
  if (!birdImg.complete) {
    // fallback circle
    ctx.fillStyle = '#fed766';
    ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2); ctx.fill();
    return;
  }
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  // The sprite naturally faces LEFT; flip horizontally so it faces RIGHT toward pipes
  ctx.scale(-1, 1);
  const bw = 90;
  const bh = birdImg.height * (bw / birdImg.width);
  // Slight hover wobble when on start screen
  let wob = 0;
  if (state === STATE.START) {
    wob = Math.sin(performance.now() / 300) * 6;
  }
  ctx.drawImage(birdImg, -bw / 2, -bh / 2 + wob, bw, bh);
  ctx.restore();
}

// ============ LOOP ============
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Wait for images, then kick off
let loaded = 0;
function onLoaded() {
  loaded++;
  if (loaded >= 2) {
    resizeCanvas();
    requestAnimationFrame(loop);
  }
}
if (birdImg.complete) onLoaded(); else birdImg.onload = onLoaded;
if (keyboardImg.complete) onLoaded(); else keyboardImg.onload = onLoaded;
// Fallback in case an image fails — start anyway
setTimeout(() => { if (loaded < 2) { resizeCanvas(); requestAnimationFrame(loop); } }, 1500);

</script>
</body>
